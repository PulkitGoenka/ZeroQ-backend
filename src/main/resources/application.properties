spring.application.name=Qpay
# Server
server.port=8080

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# SMS Provider
sms.provider=twilio

# Twilio
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}
twilio.from-number=${TWILIO_PHONE_NUMBER}
twilio.sms-enabled=true

#Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000

#MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=zeroQDB

# OTP Config
otp.expiry-minutes=5
otp.max-per-hour=10
otp.resend-cooldown-seconds=30
# Development ke liye
otp.max-resend-per-hour=20

admin.api-key=${ADMIN_API_KEY}


# TEMPORARY ? OTP bypass while Twilio quota is exhausted.
# Set OTP_BYPASS_ENABLED=true on Render to skip real SMS + allow the bypass code below to log in.
# Set back to false (or remove) once Twilio quota resets ? no code change needed.
otp.bypass-enabled=${OTP_BYPASS_ENABLED:false}
otp.bypass-code=${OTP_BYPASS_CODE:000000}